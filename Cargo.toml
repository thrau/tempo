[package]
name = "tempo"
version = "0.1.0"
edition = "2021"
description = "A simple timer, alarm and stopwatch app for GNOME (like GNOME Clocks)"
license = "GPL-3.0-or-later"
authors = ["Your Name <you@example.com>"]
default-run = "tempo"

[dependencies]
# GTK4 + libadwaita bindings for modern GNOME look (same toolkit family GNOME Clocks uses)
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
glib = "0.20"
gio = "0.20" # gtk4 0.9 pairs with glib/gio 0.20

# Configuration persistence (~/.config/tempo/config.json)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
async-channel = "2"
x11rb = "0.13"

# i18n / localization
gettext-rs = "0.7"
once_cell = "1"

[build-dependencies]
glib-build-tools = "0.20"

[profile.release]
lto = true
opt-level = 2
